
<!doctype html>
<html lang=en>
    <head>
        <title> Find Tutoring </title>
        <link rel="stylesheet" href="../static/css/style.css">
        <link rel="stylesheet" href="../static/css/style_nachhilfe.css">
    </head>
    <body>
        <header>
    <nav class="Navigation">
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#nachhilfe suchen">Find Tutoring</a></li>
    <li><a href="#nachhilfe anbieten">Offer Tutoring</a></li>
    <li><a href="#studienguides">Study Guides</a></li>
    <li><a href="#community">Community</a></li>
    <li><a href="#profil">My Profile</a></li>
  </ul>
</nav>
        <h2> Find Tutoring </h2>
        </header>
        <main>
            <p>Find the perfect tutor for your subjects</p>

            <div class="Suchfeld">
                <input type="text" placeholder="Search for subjects...">
            </div>

             <div class="Filterbox">

                 <form action="/suche" method="get">
                  <label for="site-search">Search term:</label>
                  <input type="search" id="site-search"
                        name="q" placeholder="Search...">
                  <button class="suchen" type="submit">Search</button>
                </form>
                
                
                
                <label for="Kategorie">Category:</label>
                <select name="Kategorie" id="Kategorie">
                    <option>All Categories</option>
                    <option>Mathematics</option>
                    <option>Computer Science</option>
                    <option>Marketing</option>
                    <option>Management</option>
                    <option>Social Sciences</option>
                </select>

                <label for="Studiengang">Degree Program:</label>
                <select name="Studiengang" id="Studiengang">
                    <option>All Degree Programs</option>
                    <option>BWL</option>
                    <option>WI</option>
                    <option>Media Computer Science</option>
                </select>

                <label for="Lernformat">Learning Format:</label>
                <select name="Lernformat" id="Lernformat">
                    <option>All Formats</option>
                    <option>Online</option>
                    <option>In Person</option>
                </select>

                <label for="Preis">Price:</label>
                <select name="Preis" id="Preis">
                    <option>All Prices</option>
                    <option>0-10€</option>
                    <option>10-20€</option>
                    <option>20-30€</option>
                    <option>30-40€</option>
                    <option>40-50€</option>
                </select>
            </div>


            <div class="Filter-zurücksetzen">
                <button type="button">Reset Filters</button>
            </div>


            <div class="Suchergebnisse">
                <h3>Search Results:</h3>
                <ul>
                    <li>Tutor 1</li>
                    <li>Tutor 2</li>
                    <li>Tutor 3</li>
                </ul>
            </div>

            <div class="Neue-Angebote">
                <h3>Latest Offers:</h3>
                <ul>
                    <li>Tutor 1</li>
                    <li>Tutor 2</li>
                    <li>Tutor 3</li>
                </ul>
            </div>



      
        <p></p>
        </main>
        <footer>
           <button class="zurück" type="submit">Go Back</button>
        </footer>
    </body>
</html>
