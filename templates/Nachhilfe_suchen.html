        <h2> Nachhilfe suchen </h2>
        </header>
        <main>
            <p>Finde deine perfekte Nachhilfe für deine Fächer</p>

            <div class="Suchfeld">
                <input type="text" placeholder="Suche nach Fächern...">
            </div>

             <div class="Filterbox">
                <label for="Kategorie">Kategorie:</label>
                <select name="Kategorie" id="Kategorie">
                    <option>Alle Kategorien</option>
                    <option>Mathematik</option>
                    <option>Informatik</option>
                    <option>Marketing</option>
                    <option>Management</option>
                    <option>Sozial</option>
                </select>

                <label for="Studiengang">Studiengang:</label>
                <select name="Studiengang" id="Studiengang">
                    <option>Alle Studiengänge</option>
                    <option>BWL</option>
                    <option>WI</option>
                    <option>Medieninformatik</option>
                </select>

                <label for="Lernformat">Lernformat:</label>
                <select name="Lernformat" id="Lernformat">
                    <option>Alle Formate</option>
                    <option>Online</option>
                    <option>Präsenz</option>
                </select>

                <label for="Preis">Preis:</label>
                <select name="Preis" id="Preis">
                    <option>Alle Preise</option>
                    <option>0-10€</option>
                    <option>10-20€</option>
                    <option>20-30€</option>
                    <option>30-40€</option>
                    <option>40-50€</option>
                </select>
            </div>



        </main>
