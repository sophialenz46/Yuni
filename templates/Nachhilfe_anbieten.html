
<!doctype html>
<html lang=en>
    <head>
        <title> Offer Tutoring </title>
        <link rel="stylesheet" href="../static/css/style.css">
        <link rel="stylesheet" href="../static/css/style_nachhilfe.css">
    </head>
    <body>
        <header>
    <nav class="Navigation">
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#nachhilfe suchen">Find Tutoring</a></li>
    <li><a href="#nachhilfe anbieten">Offer Tutoring</a></li>
    <li><a href="#studienguides">Study Guides</a></li>
    <li><a href="#community">Community</a></li>
    <li><a href="#profil">My Profile</a></li>
  </ul>
</nav>
        <h2> Offer Tutoring </h2>
        </header>
        <main>
          
            <h3>Create Your Tutoring Offer</h3>

            <form action="/nachhilfe/anbieten" method="POST">

                <!-- University -->
                <label for="hochschule">University:</label>
                <input type="text" id="hochschule" value="HWR Berlin" readonly>

                <!-- Title -->
                <label for="titel">Offer Title:</label>
                <input type="text" id="titel" name="titel"
                       placeholder="e.g. Programming Tutoring" required>

                <!-- Degree Program -->
                <label for="studiengang">Degree Program:</label>
                <select id="studiengang" name="studiengang" required>
                    <option value="">Select degree program</option>
                    <option value="Wirtschaftsinformatik">Business Information Systems</option>
                    <option value="BWL">Business Administration</option>
                </select>

                <!-- Module -->
                <label for="modul">Module:</label>
                <select id="modul" name="modul" required>
                    <option value="">Select module</option>
                    <option value="Programmieren 1">Programming 1</option>
                    <option value="Datenbanken">Databases</option>
                    <option value="Einführung in die Wirtschaftsinformatik">
                        Introduction to Business Information Systems
                    </option>
                </select>

                <!-- Learning Format -->
                <label for="lernformat">Learning Format:</label>
                <select id="lernformat" name="lernformat" required>
                    <option value="">Select learning format</option>
                    <option value="Online">Online</option>
                    <option value="Präsenz">In Person</option>
                    <option value="Hybrid">Hybrid</option>
                </select>

                <!-- Price -->
                <label for="preis">Price per Hour (€):</label>
                <input type="number" id="preis" name="preis"
                       min="0" step="0.01" placeholder="e.g. 15" required>

                <!-- Description -->
                <label for="beschreibung">Description:</label>
                <textarea id="beschreibung" name="beschreibung"
                          rows="5" placeholder="Describe your tutoring offer..."
                          required></textarea>

                <!-- Submit -->
                <button type="submit">Create Offer</button>

            </form>
        </main>
    </body>
</html>
