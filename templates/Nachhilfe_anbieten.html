
<!doctype html>
<html lang="en">
    <head>
        <title> Offer Tutoring </title>
        <link rel="stylesheet" href="../static/css/style.css">
        <link rel="stylesheet" href="../static/css/style_nachhilfe.css">
    </head>
    <body>
        <header>
    <nav class="Navigation">
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#nachhilfe suchen">Find Tutoring</a></li>
    <li><a href="#nachhilfe anbieten">Offer Tutoring</a></li>
    <li><a href="#studienguides">Study Guides</a></li>
    <li><a href="#community">Community</a></li>
    <li><a href="#profil">My Profile</a></li>
  </ul>
</nav>
        <h2> Offer Tutoring </h2>
        </header>
        <main>
          
            <h3>Create Your Tutoring Offer</h3>

            <form action="/nachhilfe/anbieten" method="POST" class="grid">

                <div class="g-col-12 g-col-md-6">
                    <label for="hochschule">University:</label>
                    <input type="text" id="hochschule" value="HWR Berlin" readonly>
                </div>

                <div class="g-col-12 g-col-md-6">
                    <label for="titel">Offer Title:</label>
                    <input type="text" id="titel" name="titel" placeholder="e.g. Programming Tutoring" required>
                </div>

                <div class="g-col-12 g-col-md-6">
                    <label for="studiengang">Degree Program:</label>
                    <select id="studiengang" name="studiengang" required> ... </select>
                </div>

                <div class="g-col-12 g-col-md-6">
                    <label for="modul">Module:</label>
                    <select id="modul" name="modul" required> ... </select>
                </div>

                <div class="g-col-12 g-col-md-6">
                    <label for="lernformat">Learning Format:</label>
                    <select id="lernformat" name="lernformat" required> ... </select>
                </div>

                <div class="g-col-12 g-col-md-6">
                    <label for="preis">Price per Hour (€):</label>
                    <input type="number" id="preis" name="preis" min="0" step="0.01" placeholder="e.g. 15" required>
                </div>

                <div class="g-col-12">
                    <label for="beschreibung">Description:</label>
                    <textarea id="beschreibung" name="beschreibung" rows="5" required></textarea>
                </div>

                <div class="g-col-12 g-col-md-4 g-start-md-9">
                    <button type="submit">Create Offer</button>
                </div>
            </form>
        </main>
    </body>
</html>
